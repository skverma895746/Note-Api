<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note API | Your notes, in one place</title>
    <link rel="stylesheet" href="index.css">
    <link rel="icon" href="mypic.png"
</head>

<body>
    <div class="container">
        <header class="page-header">
            <div>
                <p class="eyebrow">PERSONAL NOTEBOOK</p>
                <h1>Small thoughts.<br><em>Kept close.</em></h1>
                <p class="intro">Capture the ideas, reminders, and moments worth returning to.</p>
            </div>
            <div class="header-mark" aria-hidden="true">N<span>+</span></div>
        </header>

        <main>
            <section class="composer" aria-labelledby="composer-title">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">NEW ENTRY</p>
                        <h2 id="composer-title">What is on your mind?</h2>
                    </div>
                    <span class="section-number">01</span>
                </div>
                <div class="input-group">
                    <label for="title">Title</label>
                    <input type="text" placeholder="Give it a name" id="title">
                    <label for="description">Your note</label>
                    <textarea placeholder="Write something worth remembering..." id="description"></textarea>
                </div>
                <div class="button-group">
                    <button class="primary-action" id="submitButton" onclick="AddData()">Add note <span aria-hidden="true">+</span></button>
                    <button class="cancel-action" id="cancelButton" onclick="CancelEdit()" hidden>Cancel</button>
                    <button class="secondary-action" onclick="ShowData()">Refresh notes</button>
                </div>
            </section>

            <section class="notes-section" aria-labelledby="notes-title">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">YOUR ARCHIVE</p>
                        <h2 id="notes-title">Recent notes</h2>
                    </div>
                    <span class="section-number">02</span>
                </div>
                <div class="errorMsg" role="status" aria-live="polite"></div>
                <div class="dataList">
                    <p class="empty-state">Your notes will appear here.</p>
                </div>
            </section>
        </main>
    </div>
    <script src="index.js"></script>
</body>

</html>
